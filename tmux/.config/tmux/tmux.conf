# Mostly for servers: ssh in, `tmux new -A -s main`, nvim inside.
set -g allow-passthrough on   # let nvim's image.nvim draw plots through tmux
set -g set-clipboard on       # nvim yanks (OSC 52) reach the local clipboard over ssh
set -g mouse on
set -g escape-time 10         # no delay after <Esc> in nvim
set -g focus-events on        # nvim notices when you switch back (reloads changed files)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"  # true color under Ghostty
